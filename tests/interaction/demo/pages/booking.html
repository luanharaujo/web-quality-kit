<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Booking demo</title></head>
<body>
<!-- ?v=good | good-reads (two slow reads, then the write) | good-key (reads, then a write guarded only by its Idempotency-Key)
     | good-bg (a draft saved in the background 2.5 s after the tap) | bad-busy | bad-double | bad-optimistic | bad-error | bad-request-id -->
<form id="f">
  <label>Name <input name="name" id="name"></label>
  <button type="submit" id="go">Book</button>
</form>
<p role="status" id="status"></p>
<div id="err"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'good';
const form = document.getElementById('f');
const btn = document.getElementById('go');
const status = document.getElementById('status');
const err = document.getElementById('err');
let key = null;
let busy = false;

function setBusy(on) {
  if (v === 'bad-busy') return;            // nothing shows the tap was taken
  if (v === 'bad-double' || v === 'good-key') { // text only, the button keeps working
    if (on) status.textContent = 'Booking your slot...';
    return;
  }
  btn.disabled = on;
  form.setAttribute('aria-busy', String(on));
  if (on) status.textContent = v === 'bad-optimistic' ? 'Slot booked!' : 'Booking your slot...';
}

async function book() {
  if (busy && v !== 'bad-double' && v !== 'good-key') return;
  busy = true;
  err.innerHTML = '';
  setBusy(true);
  if (v !== 'bad-double') key = key || crypto.randomUUID();
  const headers = { 'content-type': 'application/json' };
  if (key) headers['Idempotency-Key'] = key;
  // one id per attempt, sent to the server and shown in the error
  const rid = v === 'bad-request-id' ? '' : crypto.randomUUID();
  if (rid) headers['x-request-id'] = rid;
  const code = rid ? ` (error code: ${rid})` : '';
  try {
    if (v === 'good-reads' || v === 'good-key') { // look up the slot first: the write leaves well after the tap
      await fetch(`/api/${v}/slots`);
      await fetch(`/api/${v}/slots?day=2`);
    }
    const r = await fetch(`/api/${v}/bookings`, { method: 'POST', headers, body: JSON.stringify({ name: form.name.value }) });
    if (!r.ok) throw new Error(String(r.status));
    key = null;
    status.textContent = 'Slot booked';
  } catch {
    status.textContent = '';
    if (v === 'bad-error') {
      form.reset();
      err.innerHTML = `<p role="alert">Error${code}.</p>`;
    } else {
      err.innerHTML = `<div role="alert">Could not book${code}. <button type="button" id="retry">Try again</button></div>`;
      document.getElementById('retry').onclick = () => book();
    }
  } finally {
    busy = false;
    setBusy(false);
  }
}
let tapAt = 0;
form.addEventListener('submit', (e) => {
  e.preventDefault();
  tapAt = tapAt || performance.now();
  // good-bg: a draft saved with no screen change, well after the tap
  if (v === 'good-bg') setTimeout(() => fetch('/api/good-bg/drafts', { method: 'POST', body: '{}' }), 2500);
  book();
});
</script>
</body>
</html>
