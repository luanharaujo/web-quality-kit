# Web health for one repository: lint, types, HTML, broken links, bundle size,
# Lighthouse (with axe), npm audit, tests, personal data in a public repo and
# the Baseline CSS check. Every check is optional (empty input = off). The
# numbers are compared with the last green run on the default branch ("do not
# get worse"); the first run is the baseline and never fails.
#
# The calling job needs `permissions: actions: read` (main's numbers) and Node
# (actions/setup-node) before this step. It runs inside the caller's job.
name: Web CI
description: Web health checks with a panel and "do not get worse" against main.

inputs:
  lint-paths:
    description: Paths for ESLint (space separated). Empty = off.
    default: ""
  eslint-config:
    description: The repository's own ESLint flat config. Empty = the kit's.
    default: ""
  tsc-projects:
    description: One tsconfig folder per line (tsc --noEmit). Its node_modules must be installed.
    default: ""
  html-globs:
    description: HTML files for html-validate (space separated globs). Empty = off.
    default: ""
  site-dir:
    description: Built static site, for broken links and Lighthouse. Empty = off.
    default: ""
  site-mount:
    description: Serve site-dir under this path (an app built with base "/treinos/" → "/treinos").
    default: ""
  links-skip-paths:
    description: Site paths the broken-links check ignores (space separated, e.g. "/manifest.webmanifest"). For files that exist on the real site but outside site-dir, so the check's own server cannot serve them.
    default: ""
  lighthouse-paths:
    description: Pages for Lighthouse, space separated (e.g. "/ /treinos/"). Empty = off.
    default: ""
  lighthouse-categories:
    description: Categories shown. A noindex page leaves out seo.
    default: performance accessibility best-practices seo
  lighthouse-runs:
    description: Runs per page; the median is used.
    default: "3"
  budget-mode:
    description: >
      Performance budget on the Lighthouse pages (phone, slow network): lab LCP,
      CLS, TBT, page and JS weight. "absolute" = any page over a limit fails (new
      sites); "baseline" = a page over a limit fails only when it gets worse than
      main (a site migrating to the budget). Empty = off. Needs site-dir and
      lighthouse-paths.
    default: ""
  budget-file:
    description: The repository's budget file (stricter limits, registered exceptions, migration plan). Missing = the kit's defaults.
    default: web-budget.json
  site-rules:
    description: >
      Static rules on the built site (site-dir): cache headers in _headers, fonts
      (self-hosted WOFF2, Latin subset, at most 2 weights) and images (alt, size,
      WebP/AVIF, lazy, 1600 px / 300 KB). "absolute" = any case fails; "baseline" =
      a new case fails. Empty = off.
    default: ""
  knip:
    description: >
      Unused files, exports and dependencies (knip, pinned by the kit; the repo's
      knip.json is used when present). "absolute" = any finding fails (new repo);
      "baseline" = a new finding fails, the count never grows (older repo). Empty = off.
      Install the repo's dependencies (npm ci) before this step: knip loads its configs.
    default: ""
  headers-file:
    description: The _headers file the site publishes. Empty = site-dir/_headers.
    default: ""
  bundle-dir:
    description: Folder whose .js and .css are summed (gzip). Empty = off.
    default: ""
  bundle-max-kb:
    description: Bundle limit in kB (gzip), warning only. 0 = no limit.
    default: "0"
  bundle-growth-pct:
    description: Largest bundle growth against main, in percent.
    default: "10"
  audit-dirs:
    description: Folders with a package-lock.json for npm audit. Empty = off.
    default: ""
  test-command:
    description: Shell command that runs the tests. Lines starting with ok/FALHOU are counted.
    default: ""
  server-queries:
    description: >
      The repository's server-queries.json: database checks of the server (each
      list route with 3 and with 30 rows must make the same number of queries,
      list routes without that test, missing indexes by EXPLAIN QUERY PLAN) and
      a warning for queries inside a loop. The app wraps env.DB with the kit's
      templates/server/d1_queries.ts. Empty = off.
    default: ""
  observability:
    description: >
      The repository's observability.json: logs and request ids of the server
      (every route answers with x-request-id, keeps a valid one from the caller,
      one JSON log line per request with that id, no personal data in the
      lines, no console.* outside the log helper). The app wraps its fetch
      handler with the kit's templates/server/observe.ts. Empty = off.
    default: ""
  slo:
    description: >
      The server's slo.json: availability and p95 latency targets and the alert
      limits (templates/slo.json), validated by the kit. The alert on the error
      budget reads the same file. Empty = off.
    default: ""
  data-guard:
    description: '"true" = personal data and secrets check (meant for public repositories).'
    default: "false"
  modern:
    description: '"true" = Baseline CSS check (only warns).'
    default: "true"
  lang:
    description: Panel language, "en" or "pt".
    default: en
  fail-on-worse:
    description: '"false" = only report, never fail.'
    default: "true"
  panel-artifact:
    description: >
      Artifact name under which a pull request's health panel is saved for the
      pr-description action (comment on the PR). Empty = not saved. One name per
      workflow run: two web-ci jobs in a run need different names.
    default: pr-panel

runs:
  using: composite
  steps:
    - name: Install the kit's tools
      shell: bash
      working-directory: ${{ github.action_path }}/../../tools
      run: npm ci --ignore-scripts --no-fund --no-audit --loglevel=error

    - name: Run the checks
      shell: bash
      env:
        KIT: ${{ github.action_path }}/../..
        OUT: ${{ runner.temp }}/web-health
        LINT_PATHS: ${{ inputs.lint-paths }}
        ESLINT_CONFIG: ${{ inputs.eslint-config }}
        TSC_PROJECTS: ${{ inputs.tsc-projects }}
        HTML_GLOBS: ${{ inputs.html-globs }}
        SITE_DIR: ${{ inputs.site-dir }}
        SITE_MOUNT: ${{ inputs.site-mount }}
        LINKS_SKIP_PATHS: ${{ inputs.links-skip-paths }}
        LH_PATHS: ${{ inputs.lighthouse-paths }}
        LH_CATEGORIES: ${{ inputs.lighthouse-categories }}
        LH_RUNS: ${{ inputs.lighthouse-runs }}
        BUDGET_MODE: ${{ inputs.budget-mode }}
        BUDGET_FILE: ${{ inputs.budget-file }}
        SITE_RULES: ${{ inputs.site-rules }}
        HEADERS_FILE: ${{ inputs.headers-file }}
        KNIP: ${{ inputs.knip }}
        BUNDLE_DIR: ${{ inputs.bundle-dir }}
        BUNDLE_MAX_KB: ${{ inputs.bundle-max-kb }}
        AUDIT_DIRS: ${{ inputs.audit-dirs }}
        TEST_COMMAND: ${{ inputs.test-command }}
        DATA_GUARD: ${{ inputs.data-guard }}
        SERVER_QUERIES: ${{ inputs.server-queries }}
        OBSERVABILITY: ${{ inputs.observability }}
        SLO: ${{ inputs.slo }}
        MODERN: ${{ inputs.modern }}
      run: '"$KIT/scripts/web_ci.sh"'

    # "Do not get worse": compared with the last green run of this workflow on
    # the default branch; there, the numbers are saved for the next pull requests.
    - name: Health against main
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KIT: ${{ github.action_path }}/../..
        OUT: ${{ runner.temp }}/web-health
        WORKFLOW: ${{ github.workflow }}
        MAIN: ${{ github.event.repository.default_branch }}
        GROWTH: ${{ inputs.bundle-growth-pct }}
        FAIL: ${{ inputs.fail-on-worse }}
        PANEL_LANG: ${{ inputs.lang }}
      run: |
        # A self-hosted runner started by launchd may have only /usr/bin on
        # PATH; gh usually lives in Homebrew's folder.
        export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
        if ! command -v gh >/dev/null; then
          echo "::error::gh (GitHub CLI) not found: it is needed to read main's health numbers"
          exit 1
        fi
        flags=(--bundle-growth-pct "$GROWTH" --lang "$PANEL_LANG")
        [[ "$FAIL" == "true" ]] || flags+=(--no-fail)
        base="-"
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          # A failing API call must fail the step: "no numbers yet" would switch
          # the comparison off without anyone noticing.
          if ! ids=$(gh run list --workflow "$WORKFLOW" --branch "$MAIN" --status success --limit 10 \
              --json databaseId -q '.[].databaseId'); then
            echo "::error::Could not list the runs on $MAIN to compare health"
            exit 1
          fi
          for id in $ids; do
            if gh run download "$id" --name web-health --dir "$OUT/base" >/dev/null 2>&1; then
              base="$OUT/base/health.json"; break
            fi
          done
          if [[ "$base" == "-" ]]; then
            echo "::warning::No health numbers from $MAIN: this pull request is compared with nothing (baseline)"
          fi
        fi
        rc=0
        python3 "$KIT/scripts/web_health.py" compare "$base" "$OUT/health.json" "${flags[@]}" \
          > "$OUT/panel.md" || rc=$?
        cat "$OUT/panel.md" >> "$GITHUB_STEP_SUMMARY"
        exit $rc

    # The panel for the comment on the pull request (action pr-description).
    - name: Save the panel for the PR comment
      if: always() && github.event_name == 'pull_request' && inputs.panel-artifact != ''
      continue-on-error: true  # a duplicate name (two runs of the action) must not fail the CI
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.panel-artifact }}
        path: ${{ runner.temp }}/web-health/panel.md
        if-no-files-found: ignore
        retention-days: 7

    - name: Save health numbers
      if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: web-health
        path: ${{ runner.temp }}/web-health/health.json
        retention-days: 90
