# Weekly check of the live site against its goals (web-budget.json "slo"):
# LCP p75 on a phone with a slow network, over a window of weeks, and, when a
# prober writes a log, availability against its error budget. Green when the
# goals are safe; the job fails (and GitHub tells the owner) only when a goal
# is at risk or already missed. An outage itself is the prober's alarm, not
# this one.
#
# The history of weekly numbers lives in the `web-monitor-history` artifact of
# the last run of the same workflow (90 days), so the job needs
# `permissions: actions: read`. Set up Node (actions/setup-node) before it.
# Template: templates/web-monitor.yml.
name: Web monitor
description: Weekly LCP p75 and availability of the live site against its goals.

inputs:
  base-url:
    description: Address of the live site.
    required: true
  paths:
    description: Pages to measure, space separated.
    default: /
  budget-file:
    description: The repo's budget file (its "slo" entry has the goals; none = the kit's goals).
    default: web-budget.json
  runs:
    description: Lighthouse runs per page (the week's number is their p75).
    default: "3"
  start-history:
    description: >
      "true" = start the history over on purpose (when the last runs kept none
      and you checked why). Otherwise a history that cannot be read stops the run.
    default: "false"
  probes-file:
    description: >
      Optional prober log, one "ISO time,1|0" line per probe (1 = up). Empty =
      no availability check.
    default: ""

runs:
  using: composite
  steps:
    - name: Last week's history
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        START: ${{ inputs.start-history }}
      run: |
        mkdir -p "$RUNNER_TEMP/web-monitor"
        if [[ "$START" == "true" ]]; then
          echo "::notice::History started over (start-history)."; touch "$RUNNER_TEMP/web-monitor/history.jsonl"; exit 0
        fi
        file="${GITHUB_WORKFLOW_REF%%@*}"; file="${file##*/}"
        # A week at risk fails the job, so look at completed runs, not only green
        # ones. A history that cannot be read must stop the run: starting over
        # would empty the window and turn "breached" into "ok".
        if ! runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$file" --status completed --limit 5 \
                     --json databaseId -q '.[].databaseId' 2>"$RUNNER_TEMP/web-monitor/gh.err"); then
          echo "::error::Could not list this workflow's runs (needs permissions: actions: read)"
          cat "$RUNNER_TEMP/web-monitor/gh.err"; exit 1
        fi
        found=""
        for run in $runs; do
          if gh run download "$run" -R "$GITHUB_REPOSITORY" -n web-monitor-history -D "$RUNNER_TEMP/web-monitor" \
               2>"$RUNNER_TEMP/web-monitor/gh.err"; then
            found="$run"; break
          fi
          # A run without the artifact (it failed before measuring) is skipped;
          # anything else (network, permissions) stops here.
          grep -qi "no valid artifacts\|no artifact" "$RUNNER_TEMP/web-monitor/gh.err" \
            || { echo "::error::Could not download the history of run $run"; cat "$RUNNER_TEMP/web-monitor/gh.err"; exit 1; }
        done
        if [[ -n "$found" ]]; then echo "history from run $found"
        elif [[ -n "$runs" ]]; then
          echo "::error::None of the last runs kept a history: check them, then run once with start-history: true"; exit 1
        else echo "::notice::No history yet: this week starts it."; fi
        touch "$RUNNER_TEMP/web-monitor/history.jsonl"

    - name: Measure the live site
      shell: bash
      env:
        KIT: ${{ github.action_path }}/../..
        BASE_URL: ${{ inputs.base-url }}
        PATHS: ${{ inputs.paths }}
        RUNS: ${{ inputs.runs }}
      run: |
        [[ -x "$KIT/tools/node_modules/.bin/lhci" ]] || (cd "$KIT/tools" && npm ci --ignore-scripts --no-fund --no-audit --loglevel=error)
        out="$RUNNER_TEMP/web-monitor/lhci"
        rm -rf "$out" && mkdir -p "$out"
        # One page at a time: lhci stops at the first page that fails, and the
        # pages after it must still be measured (a missing page fails below).
        for p in $PATHS; do
          rm -rf .lighthouseci
          "$KIT/tools/node_modules/.bin/lhci" collect --url "${BASE_URL%/}$p" -n "$RUNS" \
            --settings.chromeFlags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --settings.formFactor=mobile --settings.throttlingMethod=simulate >> "$RUNNER_TEMP/web-monitor/lhci.log" 2>&1 \
            || { echo "::warning::Lighthouse did not finish on $p"; tail -20 "$RUNNER_TEMP/web-monitor/lhci.log"; }
          cp .lighthouseci/lhr-*.json "$out"/ 2>/dev/null || true   # no report = the page is missing below
        done
        rm -rf .lighthouseci

    - name: Judge the goals
      id: judge
      shell: bash
      env:
        KIT: ${{ github.action_path }}/../..
        BUDGET_FILE: ${{ inputs.budget-file }}
        PROBES: ${{ inputs.probes-file }}
        PATHS: ${{ inputs.paths }}
        BASE_URL: ${{ inputs.base-url }}
      run: |
        out="$RUNNER_TEMP/web-monitor"
        rc=0
        python3 "$KIT/scripts/site_slo.py" lab "$out/lhci" --history "$out/history.jsonl" \
          --config "$BUDGET_FILE" --pages "$PATHS" --base-url "$BASE_URL" > "$out/report.md" || rc=1
        if [[ -n "$PROBES" ]]; then
          echo >> "$out/report.md"
          python3 "$KIT/scripts/site_slo.py" probe "$PROBES" --config "$BUDGET_FILE" >> "$out/report.md" || rc=1
        fi
        cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
        cat "$out/report.md"
        echo "WEB_MONITOR_RC=$rc" >> "$GITHUB_ENV"

    # Only a judged week goes back: a run that failed before (no history,
    # no measure) must not replace the last good history.
    - name: Keep the history
      if: always() && steps.judge.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: web-monitor-history
        path: ${{ runner.temp }}/web-monitor/history.jsonl
        retention-days: 90
        overwrite: true
        if-no-files-found: error

    - name: Goal at risk?
      shell: bash
      run: exit "${WEB_MONITOR_RC:-1}"
