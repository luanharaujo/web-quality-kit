# The kit's pinned tools and actions. A new version waits 7 days (cooldown)
# so a bad release is usually pulled before it reaches here; security fixes do
# not wait. Minor and patch updates come grouped; majors come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tools
    ignore:
      # typescript-eslint supports TypeScript below 6.1; TypeScript 7 (the
      # native port) breaks the lint. Lift this when typescript-eslint does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tools:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    # Workflows and the composite action the repositories run.
    directories: ["/", "/actions/web-ci"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: pip
    # tools/semgrep-requirements.txt is Semgrep's full lock (exact versions and
    # hashes). Semgrep pins some dependencies exactly (mcp, opentelemetry-*), so
    # bumping one of them alone can never install; only Semgrep itself is
    # proposed, and its PR regenerates the whole file.
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: semgrep
    ignore:
      - dependency-name: mcp
      - dependency-name: "opentelemetry-*"
    open-pull-requests-limit: 1
