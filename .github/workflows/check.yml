# The kit's own checks: every script and rule is proven here, on Linux.
name: Kit checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the kit's tools (pinned, from the lockfile)
        working-directory: tools
        run: npm ci --ignore-scripts --no-fund --no-audit --loglevel=error
      - name: Script tests
        run: |
          python3 tests/test_web_health.py
          python3 tests/test_data_guard.py
          python3 tests/test_live_check.py
      # Every tool runs on a small bad site and each problem must show up.
      - name: Security tools (pinned, SHA-256 checked)
        run: echo "$(bash scripts/install_security_tools.sh "$RUNNER_TEMP/security-tools" | tail -1)" >> "$GITHUB_PATH"
      - name: Security proof (bait repository)
        run: bash tests/test_security.sh
      - name: Tool proofs (bad site caught)
        run: bash tests/test_collect.sh

  # The action itself, as a repository would call it, on the bad site. On
  # main it saves the numbers; on a pull request it compares with them, so
  # the download of main's artifact is exercised too.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./actions/web-ci
        with:
          lint-paths: tests/casos/site
          html-globs: tests/casos/site/*.html
          site-dir: tests/casos/site
          lighthouse-paths: /
          lighthouse-runs: "1"
          bundle-dir: tests/casos/site
          data-guard: "true"
      - uses: ./actions/security
