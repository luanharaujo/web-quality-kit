# The kit's own checks: every script and rule is proven here, on Linux.
name: Kit checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the kit's tools (pinned, from the lockfile)
        working-directory: tools
        run: npm ci --ignore-scripts --no-fund --no-audit --loglevel=error
      - name: Script tests
        run: |
          python3 tests/test_web_health.py
          python3 tests/test_budget.py
          python3 tests/test_site_rules.py
          python3 tests/test_node_update.py
          python3 tests/test_site_slo.py
          python3 tests/test_data_guard.py
          python3 tests/test_live_check.py
          python3 tests/test_pr_description.py
          python3 tests/test_server_queries.py
          python3 tests/test_server_observability.py
          python3 tests/test_slo.py
      # Every tool runs on a small bad site and each problem must show up.
      - name: Security tools (pinned, SHA-256 checked)
        run: |
          bin="$(bash scripts/install_security_tools.sh "$RUNNER_TEMP/security-tools")"
          echo "${bin##*$'\n'}" >> "$GITHUB_PATH"
      - name: Security proof (bait repository)
        run: bash tests/test_security.sh
      - name: Tool proofs (bad site caught)
        run: bash tests/test_collect.sh

  # Interaction checks: the demo app's bad pages are caught, each by its rule;
  # then the action itself on the demo (bad on purpose: it reports, never gates).
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Chromium for the pinned Playwright
        working-directory: interaction
        run: |
          npm ci --ignore-scripts --no-fund --no-audit --loglevel=error
          node_modules/.bin/playwright install --with-deps chromium
      - name: Interaction proofs
        run: bash tests/test_interaction.sh
      - uses: ./actions/interaction
        with:
          working-directory: tests/interaction
          server-dirs: tests/interaction/demo
          fail-on-worse: "false"

  # The action itself, as a repository would call it, on the bad site. On
  # main it saves the numbers; on a pull request it compares with them, so
  # the download of main's artifact is exercised too.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./actions/web-ci
        with:
          lint-paths: tests/cases/site
          html-globs: tests/cases/site/*.html
          site-dir: tests/cases/site
          lighthouse-paths: /
          lighthouse-runs: "1"
          bundle-dir: tests/cases/site
          data-guard: "true"
          # The test site is bad on purpose and changes with the tests: this job
          # proves the action runs end to end, it does not gate the kit.
          fail-on-worse: "false"
      - uses: ./actions/security
