# Copy to .github/dependabot.yml and add one npm entry per folder with a
# package-lock.json (and each composite action folder to "directories"). A new version waits 7 days (cooldown) so a bad release
# is usually pulled before it arrives; security fixes do not wait. Minor and
# patch updates come grouped; majors come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
