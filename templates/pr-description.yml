# Copy to .github/workflows/pr-description.yml. Replace the all-zero SHA with the release
# commit, with the version in a comment (never @v1), like the other kit actions.
#
# This is the required check `pr-descricao`, in a workflow of its own: it is the only
# one that listens to `edited`. In the CI workflow, an edit of the description would
# start a second run on the same commit and cancel the first, and the cancelled checks
# keep the pull request red even after the new run passes. For the same reason there
# is no `concurrency` here, and no `needs`, `if` or path filter: it reports on every
# pull request. The checks and health comment is templates/pr-comment-job.yml.
name: PR description

on:
  pull_request:
    # No ready_for_review: checks already run on drafts, and a rerun on the same
    # commit leaves the pull request pending after the code owner is asked.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-descricao:
    # Dependabot code never runs on the owner's Mac.
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: luanharaujo/web-quality-kit/actions/pr-description@0000000000000000000000000000000000000000 # vX.Y.Z  <- replace with the release commit
        with:
          mode: lint
